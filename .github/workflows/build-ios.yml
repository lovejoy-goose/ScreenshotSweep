name: Build iOS (unsigned)

on:
  push:
    branches: [main]
    # Markdown-only changes (docs, README, CLAUDE.md) do not build: no test reads a .md file.
    # docs/nfc-bridge-reference.html and this workflow are read by tests, so they still build.
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# A newer push to the same PR or branch makes the running build obsolete: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick iPhone Simulator
        id: sim
        run: |
          # Newest available iOS runtime, first iPhone on it — no hardcoded device names.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(x) for x in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1])]
          runtimes = sorted((r for r in devices if ".SimRuntime.iOS-" in r), key=version, reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boot in the background while the next step compiles; xcodebuild waits for it if needed.
          (xcrun simctl boot "$UDID" >/dev/null 2>&1 || true) &

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project KatanaConnector.xcodeproj \
            -scheme KatanaConnector \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project KatanaConnector.xcodeproj \
            -scheme KatanaConnector \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build Share Extension (not embedded, D-046)
        run: |
          set -o pipefail
          xcodebuild \
            -project KatanaConnector.xcodeproj \
            -target KatanaShareExtension \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build-extension" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          EXT=build-extension/Release-iphoneos/KatanaShareExtension.appex
          test -d "$EXT"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$EXT/Info.plist" | grep -qx "com.apple.share-services"

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/KatanaConnector.app
          test -d "$APP"
          # The custom URL scheme must be registered in the built app.
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - "$APP/Info.plist" | grep -qx "katana-connector"
          # Usage descriptions for camera, When-In-Use location and motion must be present...
          for key in NSCameraUsageDescription NSLocationWhenInUseUsageDescription NSMotionUsageDescription NSPhotoLibraryUsageDescription; do
            plutil -extract "$key" xml1 -o - "$APP/Info.plist" > /dev/null
          done
          # Always only for user geofences (D-049): its description must be present...
          plutil -extract NSLocationAlwaysAndWhenInUseUsageDescription xml1 -o - "$APP/Info.plist" > /dev/null
          # ...but no legacy Always key, background modes, NFC usage or embedded extensions (D-046).
          test ! -d "$APP/PlugIns"
          for key in NSLocationAlwaysUsageDescription UIBackgroundModes NFCReaderUsageDescription; do
            if plutil -extract "$key" xml1 -o - "$APP/Info.plist" > /dev/null 2>&1; then echo "Unexpected $key"; exit 1; fi
          done
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry KatanaConnector.ipa Payload
          ls -lh KatanaConnector.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: katana-connector-unsigned-ipa
          path: KatanaConnector.ipa
          if-no-files-found: error
