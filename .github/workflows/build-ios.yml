name: Build iOS (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project KatanaConnector.xcodeproj \
            -scheme KatanaConnector \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/KatanaConnector.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry KatanaConnector.ipa Payload
          ls -lh KatanaConnector.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: katana-connector-unsigned-ipa
          path: KatanaConnector.ipa
          if-no-files-found: error
