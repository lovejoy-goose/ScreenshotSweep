name: KatanaConnector
options:
  bundleIdPrefix: app.katana
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KatanaConnector:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.katana.connector
        PRODUCT_NAME: KatanaConnector
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Katana Connector
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Katana Connector использует камеру только для сканирования QR-кода подключения к Katana. Изображение с камеры не сохраняется и никуда не отправляется."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Katana Connector показывает ваши скриншоты в разделе «Разобрать скриншоты», чтобы вы могли решить, какие удалить. Ничего не удаляется без вашего подтверждения, фото не отправляются в сеть."
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      testTargets:
        - KatanaConnectorTests

  # Core unit tests: compiles Sources/Core directly, no host app and no UI.
  KatanaConnectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Core
      - Tests/KatanaConnectorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.katana.connector.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
