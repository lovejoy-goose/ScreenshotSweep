name: KatanaConnector
options:
  bundleIdPrefix: app.katana
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  KatanaConnector:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.katana.connector
        PRODUCT_NAME: KatanaConnector
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Base plist with CFBundleURLTypes (scheme katana-connector, URL v1); generated keys are merged in.
        INFOPLIST_FILE: Config/KatanaConnector-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Katana Connector
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Katana Connector использует камеру только для сканирования QR-кода подключения к Katana и для ручной проверки камеры в Capability Lab. Изображение с камеры не сохраняется и никуда не отправляется."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Katana Connector определяет местоположение один раз и только по вашей кнопке: «Проверить геолокацию» в Capability Lab (координаты сразу отбрасываются) или «Определить текущее место» в Location Check-in — тогда координаты отправляются в Katana только после предпросмотра и вашего подтверждения. Фоновой геолокации нет."
        INFOPLIST_KEY_NSMotionUsageDescription: "Katana Connector определяет вид активности (ходьба, бег, транспорт и т.п.) только по вашим кнопкам: «Проверить датчики движения» в Capability Lab и «Определить текущую активность» или «Начать сессию» в Activity Journal. Сырые данные датчиков не сохраняются; в Katana уходят только вид активности и длительности — после вашего подтверждения."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Katana Connector показывает ваши скриншоты в разделе «Разобрать скриншоты», чтобы вы могли решить, какие удалить. Ничего не удаляется без вашего подтверждения, фото не отправляются в сеть."
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      testTargets:
        - KatanaConnectorTests

  # Core unit tests: compiles Sources/Core directly, no host app and no UI.
  KatanaConnectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Core
      - Tests/KatanaConnectorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.katana.connector.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
